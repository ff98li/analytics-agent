[project]
name = "analytics-agent"
version = "0.1.0"
description = "analytics-agent plug point for the local lakehouse agent: lumid-gateway data plane + baseline nl2workflow and structural scorer."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary]>=3.2",
    "boto3>=1.35",
    "pydantic>=2.8",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analytics_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
